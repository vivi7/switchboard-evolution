<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Switchboard</title>
  <link rel="stylesheet" href="../node_modules/@xterm/xterm/css/xterm.css">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="whats-new.css">
  <link rel="stylesheet" href="git-graph.css">
  <link rel="stylesheet" href="pull-requests.css">
  <link rel="stylesheet" href="actions.css">
  <link rel="stylesheet" href="web-page.css">
  <link rel="stylesheet" href="command-catalog.css">
  <script src="accent.js"></script>
</head>
<body>
  <div id="app-container">
  <div id="sidebar">
    <button id="sidebar-expand-btn" title="Show sidebar"><svg stroke="currentColor" fill="currentColor" stroke-width="0" viewBox="0 0 24 24" height="20" width="20" xmlns="http://www.w3.org/2000/svg"><path d="M18 3a3 3 0 0 1 2.995 2.824l.005 .176v12a3 3 0 0 1 -2.824 2.995l-.176 .005h-12a3 3 0 0 1 -2.995 -2.824l-.005 -.176v-12a3 3 0 0 1 2.824 -2.995l.176 -.005h12zm-3 2h-9a1 1 0 0 0 -.993 .883l-.007 .117v12a1 1 0 0 0 .883 .993l.117 .007h9v-14zm-5.387 4.21l.094 .083l2 2a1 1 0 0 1 .083 1.32l-.083 .094l-2 2a1 1 0 0 1 -1.497 -1.32l.083 -.094l1.292 -1.293l-1.292 -1.293a1 1 0 0 1 -.083 -1.32l.083 -.094a1 1 0 0 1 1.32 -.083z"></path></svg></button>
    <div id="sidebar-header">
      <div id="sidebar-tabs">
        <button class="sidebar-tab" data-tab="projects" data-tip="Projects" aria-label="Projects"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="20" height="14" x="2" y="7" rx="2"/><path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"/></svg></button>
        <button class="sidebar-tab active" data-tab="sessions" data-tip="Sessions" aria-label="Sessions"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3H5a2 2 0 0 0-2 2v3"/><path d="M16 3h3a2 2 0 0 1 2 2v3"/><path d="M8 21H5a2 2 0 0 1-2-2v-3"/><path d="M16 21h3a2 2 0 0 0 2-2v-3"/><path d="m8 10 2 2-2 2"/><path d="M13 14h3"/></svg></button>
        <button class="sidebar-tab" data-tab="plans" data-tip="Plans" aria-label="Plans"><svg width="18" height="18" viewBox="0 0 17 17" fill="currentColor" stroke="currentColor" stroke-width="0"><path d="M14 2v-2h-13v17h13v-2h2v-13h-2zM2 16v-15h2v15h-2zM13 16h-8v-15h8v15zM15 14h-1v-3h1v3zM15 10h-1v-3h1v3zM14 6v-3h1v3h-1zM6 4h5v1h-5v-1zM6 6h4v1h-4v-1z"/></svg></button>
        <button class="sidebar-tab" data-tab="memory" data-tip="Files" aria-label="Files"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 7h-3a2 2 0 0 1-2-2V2"/><path d="M9 18a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h7l4 4v10a2 2 0 0 1-2 2Z"/><path d="M3 7.6v12.8A1.6 1.6 0 0 0 4.6 22h9.8"/></svg></button>
        <button class="sidebar-tab" data-tab="stats" data-tip="Stats" data-window="stats" aria-label="Stats"><svg width="18" height="18" viewBox="0 0 512 512" fill="currentColor" stroke="currentColor" stroke-width="0"><path d="M128 496H48V304h80zm224 0h-80V208h80zm112 0h-80V96h80zm-224 0h-80V16h80z"/></svg></button>
        <!-- These two open a page in the main area instead of changing the sidebar. -->
        <button class="sidebar-tab" id="task-manager-tab" data-tip="Task Manager" data-window="task-manager" aria-label="Task Manager"></button>
        <button class="sidebar-tab" id="global-settings-btn" data-tip="Global settings" aria-label="Global settings"></button>
        <button id="remote-access-devices-btn" type="button" aria-label="Mobile devices" title="Mobile devices"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="6" y="2" width="12" height="20" rx="2.5"/><path d="M11 18h2"/></svg><span class="remote-access-count"></span></button>
        <button id="sidebar-collapse-btn" title="Hide sidebar"><svg stroke="currentColor" fill="currentColor" stroke-width="0" viewBox="0 0 24 24" height="20" width="20" xmlns="http://www.w3.org/2000/svg"><path d="M18 3a3 3 0 0 1 2.995 2.824l.005 .176v12a3 3 0 0 1 -2.824 2.995l-.176 .005h-12a3 3 0 0 1 -2.995 -2.824l-.005 -.176v-12a3 3 0 0 1 2.824 -2.995l.176 -.005h12zm0 2h-9v14h9a1 1 0 0 0 .993 -.883l.007 -.117v-12a1 1 0 0 0 -.883 -.993l-.117 -.007zm-2.293 4.293a1 1 0 0 1 .083 1.32l-.083 .094l-1.292 1.293l1.292 1.293a1 1 0 0 1 .083 1.32l-.083 .094a1 1 0 0 1 -1.32 .083l-.094 -.083l-2 -2a1 1 0 0 1 -.083 -1.32l.083 -.094l2 -2a1 1 0 0 1 1.414 0z"></path></svg></button>
      </div>
      <div id="session-filters">
        <div class="session-filter-row">
          <select id="session-status-select" class="session-filter-select" title="Show sessions by status" aria-label="Status">
            <option value="all">All statuses</option>
            <option value="running">Running</option>
            <option value="attention">Needs input</option>
            <option value="stopped">Not running</option>
          </select>
          <select id="session-pinned-select" class="session-filter-select" title="Show pinned or unpinned sessions" aria-label="Pinned">
            <option value="all">Pinned or not</option>
            <option value="pinned">Pinned</option>
            <option value="unpinned">Not pinned</option>
          </select>
          <select id="session-order-select" class="session-filter-select" title="Order sessions by" aria-label="Order">
            <option value="recent">Most recent first</option>
            <option value="priority">Running &amp; pinned first</option>
          </select>
        </div>
        <div class="session-filter-row">
          <label id="group-folders-label" title="List sessions under their folders"><input type="checkbox" id="group-folders-toggle"><span>Group by folders</span></label>
          <button id="archive-toggle" title="Show archived sessions"></button>
          <span id="loading-status" style="display:none;"></span>
          <button id="resort-btn" title="Re-sort sessions"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/></svg></button>
          <button id="add-project-btn" title="Add Folder"><svg width="14" height="14" viewBox="0 0 512 512" fill="currentColor" stroke="currentColor" stroke-width="0"><path d="M512 416c0 35.3-28.7 64-64 64L64 480c-35.3 0-64-28.7-64-64L0 96C0 60.7 28.7 32 64 32l128 0c20.1 0 39.1 9.5 51.2 25.6l19.2 25.6c6 8.1 15.5 12.8 25.6 12.8l160 0c35.3 0 64 28.7 64 64l0 256zM232 376c0 13.3 10.7 24 24 24s24-10.7 24-24l0-64 64 0c13.3 0 24-10.7 24-24s-10.7-24-24-24l-64 0 0-64c0-13.3-10.7-24-24-24s-24 10.7-24 24l0 64-64 0c-13.3 0-24 10.7-24 24s10.7 24 24 24l64 0 0 64z"/></svg></button>
        </div>
      </div>
    </div>
    <div id="search-bar">
      <input id="search-input" type="text" placeholder="Search sessions..." />
      <button id="search-clear" type="button" aria-label="Clear search">&times;</button>
      <button id="search-titles-toggle" type="button" title="Search titles only" aria-label="Search titles only">Tt</button>
      <select id="projects-group-select" title="Group each project's sessions by" aria-label="Group sessions by">
        <option value="time">Time</option>
        <option value="track">Track</option>
        <option value="state">State</option>
      </select>
    </div>
    <!-- The Files tab's filter, right under its search field (files-view.js). -->
    <div id="files-filters" style="display:none;">
      <select id="files-filter-select" class="session-filter-select" title="Show the files of the list" aria-label="Show">
        <option value="all">All files</option>
        <option value="agents">Agent files</option>
        <option value="opened">Opened files</option>
      </select>
    </div>
    <!-- The Plans tab's Group, Filter and Sort, under its search field (plans-memory-view.js fills the combos from plans-list.js). -->
    <div id="plans-filters" style="display:none;">
      <select id="plans-group-select" class="session-filter-select" title="Group the plans by" aria-label="Group plans by"></select>
      <button id="plans-filter-btn" class="session-filter-select" type="button" title="Filter the plans" aria-label="Filter plans" aria-haspopup="menu">All plans</button>
      <select id="plans-sort-select" class="session-filter-select" title="Sort the plans by" aria-label="Sort plans by"></select>
    </div>
    <div id="search-actions" hidden>
      <span id="search-actions-count"></span>
      <button id="search-restore-btn" type="button" hidden></button>
      <button id="search-stop-btn" type="button"></button>
    </div>
    <div id="sidebar-content"></div>
    <div id="projects-content" style="display:none;"></div>
    <!-- The donation box, pinned below the projects list, which scrolls above it (donate-box.js fills it). -->
    <div id="donate-bar" hidden></div>
    <div id="plans-content" style="display:none;"></div>
    <div id="stats-content" style="display:none;">
      <div class="plans-empty">Click the Stats tab to view activity heatmap.</div>
    </div>
    <div id="memory-content" style="display:none;"></div>
    <!-- Shown while a file from outside the app is dragged over the sidebar (files-drop.js). -->
    <div id="sidebar-drop-overlay" hidden>
      <div class="sidebar-drop-half" data-drop="here">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M9 3v18"/></svg>
        <span class="sidebar-drop-title">Open here</span>
        <span class="sidebar-drop-hint">In the Files tab's editor</span>
      </div>
      <div class="sidebar-drop-half" data-drop="window">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 3h7v7"/><path d="M21 3l-9 9"/><path d="M19 14v5a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V7a2 2 0 0 1 2-2h5"/></svg>
        <span class="sidebar-drop-title">Open in new window</span>
        <span class="sidebar-drop-hint">An editor of its own</span>
      </div>
    </div>
  </div>
  <div id="sidebar-resize-handle"></div>
  <div id="main">
    <div id="placeholder">
      <p>Select a session from the sidebar to begin.</p>
    </div>
    <div id="stats-viewer" style="display:none;">
      <div id="stats-viewer-header">
        <span id="stats-viewer-title">Activity</span>
      </div>
      <div id="stats-viewer-body"></div>
    </div>
    <div id="memory-viewer" style="display:none;"></div>
    <div id="plan-viewer" style="display:none;"></div>
    <div id="project-viewer" style="display:none;"></div>
    <div id="settings-viewer" style="display:none;">
      <div id="settings-viewer-header">
        <span id="settings-viewer-title">Settings</span>
      </div>
      <div id="settings-viewer-body"></div>
    </div>
    <div id="process-viewer" style="display:none;">
      <div id="process-viewer-header">
        <span id="process-viewer-title">Task Manager</span>
        <span id="process-viewer-subtitle">RAM per session</span>
        <span id="process-viewer-status" class="pm-status"></span>
        <button id="process-viewer-refresh" type="button" title="Refresh now" aria-label="Refresh now"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3v6h-6"/></svg></button>
        <button id="process-viewer-close" type="button" title="Close" aria-label="Close">&times;</button>
      </div>
      <div id="process-viewer-body"></div>
    </div>
    <div id="jsonl-viewer" style="display:none;">
      <div id="jsonl-viewer-header">
        <span id="jsonl-viewer-title">Message History</span>
        <span id="jsonl-viewer-session-id"></span>
      </div>
      <div id="jsonl-viewer-body"></div>
    </div>
    <div id="terminal-area">
      <div id="terminal-header" style="display:none;">
        <div id="terminal-header-info">
          <span id="terminal-header-name"></span>
          <span id="terminal-header-pty-title" style="display:none;"></span>
          <span id="terminal-header-id"></span>
          <span id="terminal-header-shell" style="display:none;"></span>
        </div>
        <div id="terminal-header-controls">
          <span id="terminal-header-status"></span>
          <button id="terminal-restart-task-btn" title="Restart task" style="display:none;"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 11a8.1 8.1 0 1 0 2 5.3"/><path d="M20 4v7h-7"/></svg></button>
          <button id="terminal-stop-btn" title="Stop process"><svg width="12" height="12" viewBox="0 0 12 12" fill="currentColor"><rect x="2" y="2" width="8" height="8" rx="1"/></svg></button>
        </div>
      </div>
      <div id="grid-viewer" style="display:none;">
        <div id="grid-viewer-header">
          <span id="grid-viewer-title">Session Overview</span>
          <span id="grid-viewer-count"></span>
        </div>
      </div>
      <div id="terminals"></div>
    </div>
  </div>
  </div><!-- /app-container -->
  <div id="update-toast" class="hidden">
    <span id="update-toast-msg">Update ready — restart to apply</span>
    <button id="update-restart-btn">Restart</button>
    <button id="update-dismiss-btn">Later</button>
  </div>
  <div id="status-bar"><span id="status-bar-info"></span><span id="status-bar-resources" role="button" tabindex="0" title="Open the Task Manager"></span><span id="status-bar-quota" style="display:none;"><span class="quota-track"><span class="quota-fill"></span></span><span class="quota-pct"></span></span><span id="status-bar-activity"></span><span id="status-bar-updater"></span></div>

  <script src="settings-model.js"></script>
  <script src="editor-settings.js"></script>
  <script src="prompt-improver-settings.js"></script>
  <script src="settings-panel.js"></script>
  <script src="session-config-form.js"></script>
  <script src="utils.js"></script>
  <script src="terminal-themes.js"></script>

  <script src="dialogs.js"></script>
  <script src="search-results.js"></script>
  <script src="session-list.js"></script>
  <script src="star-tints.js"></script>
  <script src="pinned-order.js"></script>
  <script src="repo-colors.js"></script>
  <script src="repo-selection.js"></script>
  <script src="sidebar.js"></script>
  <script src="plan-parser.js"></script>
  <script src="snooze.js"></script>
  <script src="schedule-time.js"></script>
  <script src="schedules.js"></script>
  <script src="project-lsp-settings.js"></script>
  <script src="projects-view.js"></script>
  <script src="project-files-view.js"></script>
  <script src="env-files-model.js"></script>
  <script src="project-env-view.js"></script>
  <script src="note-panel.js"></script>
  <script src="project-files-search.js"></script>
  <script src="project-git-view.js"></script>
  <script src="git-repo-tabs.js"></script>
  <script src="git-graph-layout.js"></script>
  <script src="git-graph-render.js"></script>
  <script src="git-graph-compare.js"></script>
  <script src="git-graph-dialogs.js"></script>
  <script src="git-graph-menus.js"></script>
  <script src="git-graph-settings.js"></script>
  <script src="project-git-graph-view.js"></script>
  <script src="plans-list.js"></script>
  <script src="plans-memory-view.js"></script>
  <script src="files-list.js"></script>
  <script src="files-view.js"></script>
  <script src="project-worktrees-view.js"></script>
  <script src="knowledge-model.js"></script>

  <script src="project-knowledge-analysis.js"></script>
